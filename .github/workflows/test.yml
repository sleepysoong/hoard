name: Tests

# The full Robolectric/E2E suite runs here, not on the (low-spec) dev machine.
# It also builds the real sleepyrouter and runs RealSleepyrouterTest against it.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_oracles:
        description: 'Run emulator flows and verify deliberate behavioral failures are caught'
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Hoard
        uses: actions/checkout@v4

      - name: Checkout sleepyrouter
        uses: actions/checkout@v4
        with:
          repository: sleepysoong/sleepyrouter
          path: sleepyrouter

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sleepyrouter/go.mod
          cache-dependency-path: sleepyrouter/go.sum

      - name: Build sleepyrouter
        run: go build -o "$RUNNER_TEMP/sleepyrouter" ./cmd/sleepyrouter
        working-directory: sleepyrouter

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Check skill patterns with native ICU (Android regex dialect)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libicu-dev
          python3 scripts/check-skill-regex.py

      - name: Verify low-spec launcher safety
        run: |
          mkdir -p app/build/test-artifacts/low-spec
          python3 scripts/test-gradlew-lowspec.py 2>&1 | tee app/build/test-artifacts/low-spec/launcher-tests.txt

      - name: Run tests (incl. real sleepyrouter)
        env:
          SLEEPYROUTER_BIN: ${{ runner.temp }}/sleepyrouter
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Summarize
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, os
          t = s = f = 0
          fails = []
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              x = open(p, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', x)
              t += int(m[1]); s += int(m[2]); f += int(m[3]) + int(m[4])
              for c in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]{0,300})', x):
                  fails.append(f"- `{c[2].split('.')[-1]}.{c[1]}`: {c[3]}")
          out = [f"**{t} tests · {s} skipped · {f} failed**", *fails]
          print("\n".join(out))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          EOF

      - name: Upload test results and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoard-test-output
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-artifacts/
            app/build/reports/tests/
          retention-days: 14

  native-oracles:
    if: github.event_name == 'workflow_dispatch' && inputs.native_oracles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and enable emulator acceleration
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          sudo chmod 666 /dev/kvm
      - name: Baseline behavior and oracle mutations on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HOARD_VERIFY_ORACLES: 'true'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-native-smoke.sh
      - name: Upload native behavior and oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoard-native-oracles
          path: |
            app/build/native-smoke/
            !app/build/native-smoke/browser-fixture/profile/**
            !app/build/native-smoke/browser-fixture/client-key
            !app/build/native-smoke/browser-fixture/host-key
            !app/build/native-smoke/browser-fixture/vnc.auth
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
