name: Build and Release

on:
  push:
    branches:
      - main

# Pushes that land while a release is building queue up instead of racing:
# a concurrent run would bump from a stale version.properties and have its
# version-bump push rejected (fetch first).
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Build the tip of main (includes the previous run's version bump),
          # not the possibly stale triggering SHA.
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Auto-increment Version Code & Name
        id: version_bump
        run: |
          version_code=$(grep "versionCode=" version.properties | cut -d'=' -f2)
          version_name=$(grep "versionName=" version.properties | cut -d'=' -f2)

          new_version_code=$((version_code + 1))

          IFS='.' read -r major minor patch <<< "$version_name"
          new_patch=$((patch + 1))
          new_version_name="${major}.${minor}.${new_patch}"

          echo "versionCode=${new_version_code}" > version.properties
          echo "versionName=${new_version_name}" >> version.properties

          echo "Bumped version: ${version_name} (Code: ${version_code}) -> ${new_version_name} (Code: ${new_version_code})"

          echo "version_name=${new_version_name}" >> $GITHUB_OUTPUT
          echo "version_code=${new_version_code}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # A host-JVM run cannot verify Android ICU, Keystore, input or SSH/VNC.
      # Gate publishing on native chat and real headful Chrome desktop flows.
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Run native Android chat and real browser smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-native-smoke.sh

      - name: Upload native Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoard-native-smoke
          path: |
            app/build/native-smoke/
            !app/build/native-smoke/browser-fixture/profile/**
            !app/build/native-smoke/browser-fixture/client-key
            !app/build/native-smoke/browser-fixture/host-key
            !app/build/native-smoke/browser-fixture/vnc.auth
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

      - name: Name APK after the version
        run: |
          apk="hoard-${{ steps.version_bump.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$apk"
          echo "Built $apk"

      - name: Require full test suite success before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release bot's one-file version bumps intentionally do not start
          # another CI run. Gate on the latest source change in this checkout.
          source_sha=$(git log -1 --format=%H -- . ':!version.properties')
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=Tests --commit "$source_sha" --limit=1 --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            read -r status conclusion <<< "$state"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Full suite did not pass: $conclusion ($source_sha)" >&2; exit 1; }
              echo "Full suite passed for $source_sha"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the full test suite ($source_sha)" >&2
          exit 1

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to ${{ steps.version_bump.outputs.version_name }} (code: ${{ steps.version_bump.outputs.version_code }}) [skip ci]"
          # Commits pushed while this run was building (they queue their own run)
          # would reject a plain push. Rebase the one-file bump onto them and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1

      - name: Create Git Tag
        run: |
          git tag v${{ steps.version_bump.outputs.version_name }}
          git push origin v${{ steps.version_bump.outputs.version_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_bump.outputs.version_name }}
          name: Release v${{ steps.version_bump.outputs.version_name }}
          body: |
            Automatically generated release for version ${{ steps.version_bump.outputs.version_name }} (code: ${{ steps.version_bump.outputs.version_code }}).
            This APK is fully signed and supports seamless updates without reinstallation.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/hoard-${{ steps.version_bump.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
