# Low-spec defaults: the dev box has 3 cores / 6 GB and freezes under a full build.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Release the daemon quickly instead of holding ~1.5 GB between builds.
org.gradle.daemon.idletimeout=60000
